site_name: "Dr. Harsh Kumar Narula"
site_description: "Computational Scientist | Scientific Software Engineer | Materials Science"
site_author: "Harsh Kumar Narula"
site_url: "https://harshkumarnarula.com"

theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
    - header.autohide
  palette:
    - scheme: default
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    logo: material/flask-outline
    repo: fontawesome/brands/github

repo_url: https://github.com/harshn05
repo_name: GitHub

plugins:
  - search
  - tags

nav:
  - Home: index.md
  - About: about.md
  - Research:
      - Overview: research/index.md
      - Scientific Software Engineering: research/soft.md
      - PhD Research: research/PhD.md 
  - Projects:
      - Overview: projects/index.md
      - WinDev: projects/windev.md
  - Publications: publications.md
  - CV: cv.md

extra_css:
  - stylesheets/extra.css
  - stylesheets/research.css

extra:
  generator: false
  analytics:
    - provider: google
    - property: G-3SGJXK65DQ
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/harshn05
    - icon: fontawesome/brands/orcid
      link: https://orcid.org/0000-0003-3902-2189
    - icon: fontawesome/brands/google-scholar
      link: https://scholar.google.com/citations?user=J8XsOPUAAAAJ&hl=en
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/harshn/
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/harshiitb
    - icon: fontawesome/solid/envelope
      link: mailto:harsh.narula@iitbombay.org

copyright: "© 2026 Dr. Harsh Kumar Narula"

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
